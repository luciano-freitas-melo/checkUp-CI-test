name: Scraper Health Monitor

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  monitor-scrapers:
    name: Monitor Scraper Health
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "requirements.txt not found, continuing..."

      - name: Test Individual Scrapers
        id: scraper-test
        run: |
          echo "FAILED_SCRAPERS=" >> $GITHUB_OUTPUT
          echo "ERROR_LOGS=" >> $GITHUB_OUTPUT

          # Lista dos portais baseada nos arquivos existentes
          portals=()
          error_logs=""

          # Detectar automaticamente os spiders disponíveis
          if [ -d "spiders" ]; then
            for spider_file in spiders/*.py; do
              if [ -f "$spider_file" ]; then
                filename=$(basename "$spider_file" .py)
                # Filtrar apenas arquivos que são realmente spiders (excluir base, items, __init__)
                if [[ "$filename" != "__init__" && "$filename" != "base" && "$filename" != "items" ]]; then
                  portals+=("$filename")
                fi
              fi
            done
          fi

          echo "Detected portals: ${portals[@]}"

          failed_portals=""

          for portal in "${portals[@]}"; do
            echo "Testing $portal..."
            
            spider_success=0
            play_success=0
            spider_error=""
            play_error=""
            
            # Criar script temporário para teste do spider
            cat > /tmp/test_spider.py << EOF
          import sys
          import traceback
          sys.path.append('.')
          try:
              module = __import__('spiders.${portal}', fromlist=[''])
              print('${portal} spider import: OK')
          except Exception as e:
              print(f'SPIDER_ERROR: {e}')
              traceback.print_exc()
              sys.exit(1)
          EOF
            
            # Teste do Spider
            set +e
            spider_error=$(python /tmp/test_spider.py 2>&1)
            spider_success=$?
            
            # Criar script temporário para teste do play
            cat > /tmp/test_play.py << EOF
          import sys
          import traceback
          sys.path.append('.')
          try:
              module = __import__('plays.${portal}', fromlist=[''])
              print('${portal} play import: OK')
          except Exception as e:
              print(f'PLAY_ERROR: {e}')
              traceback.print_exc()
              sys.exit(1)
          EOF
            
            # Teste do Play
            play_error=$(python /tmp/test_play.py 2>&1)
            play_success=$?
            set -e
            
            # Limpar arquivos temporários
            rm -f /tmp/test_spider.py /tmp/test_play.py
            
            # Verificar se houve falha
            if [ $spider_success -ne 0 ] || [ $play_success -ne 0 ]; then
              echo "$portal: ❌ FAILED"
              if [ -n "$failed_portals" ]; then
                failed_portals="$failed_portals,$portal"
              else
                failed_portals="$portal"
              fi
              
              # Capturar logs de erro
              portal_errors="### $portal Errors:\n"
              if [ $spider_success -ne 0 ]; then
                portal_errors="$portal_errors**Spider Error:**\n\`\`\`\n$spider_error\n\`\`\`\n\n"
              fi
              if [ $play_success -ne 0 ]; then
                portal_errors="$portal_errors**Play Error:**\n\`\`\`\n$play_error\n\`\`\`\n\n"
              fi
              
              if [ -n "$error_logs" ]; then
                error_logs="$error_logs\n$portal_errors"
              else
                error_logs="$portal_errors"
              fi
            else
              echo "$portal: ✅ OK"
            fi
          done

          echo "FAILED_SCRAPERS=$failed_portals" >> $GITHUB_OUTPUT

          # Salvar logs em arquivo temporário para passar entre steps
          echo -e "$error_logs" > /tmp/error_logs.txt

          echo "Failed scrapers: $failed_portals"
          echo "Error logs saved to /tmp/error_logs.txt"

      - name: Read Error Logs
        id: read-logs
        if: steps.scraper-test.outputs.FAILED_SCRAPERS != ''
        run: |
          if [ -f "/tmp/error_logs.txt" ]; then
            # Escapar newlines para GitHub Actions
            error_content=$(cat /tmp/error_logs.txt | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
            echo "ERROR_LOGS=$error_content" >> $GITHUB_OUTPUT
          else
            echo "ERROR_LOGS=No error logs available" >> $GITHUB_OUTPUT
          fi

      - name: Create Issues for Failed Scrapers
        if: steps.scraper-test.outputs.FAILED_SCRAPERS != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failedScrapers = '${{ steps.scraper-test.outputs.FAILED_SCRAPERS }}';
            const errorLogs = `${{ steps.read-logs.outputs.ERROR_LOGS }}`.replace(/\\n/g, '\n').replace(/\\"/g, '"');

            if (!failedScrapers) return;

            const scrapers = failedScrapers.split(',').filter(s => s.trim());

            for (const scraper of scrapers) {
              const portalName = scraper.charAt(0).toUpperCase() + scraper.slice(1);
              
              // Verificar se já existe issue aberta para este scraper
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'scraper,portal,automated,bug',
                state: 'open'
              });
              
              const existingIssue = existingIssues.data.find(issue => 
                issue.title.toLowerCase().includes(scraper.toLowerCase()) &&
                issue.body.includes('Health Check Failed')
              );
              
              const currentDate = new Date().toLocaleString('pt-BR', {
                timeZone: 'America/Sao_Paulo',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
              });
              
              // Extrair logs específicos do portal
              const portalLogs = errorLogs.split('### ').find(log => 
                log.toLowerCase().startsWith(scraper.toLowerCase())
              );
              
              const logSection = portalLogs ? `## 📋 Logs de Erro\n\n${portalLogs}` : '## 📋 Logs de Erro\n\nNenhum log específico capturado.';
              
              if (existingIssue) {
                const comment = `## 🔄 Falha Recorrente Detectada

            **Data/Hora**: ${currentDate}  
            **Status**: Scraper ainda falhando no health check

            O scraper do **${portalName}** continua apresentando problemas. Requer atenção urgente.

            ${logSection}

            ---

            *Update automático do monitor de scrapers*`;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: comment
                });
                
                console.log(`Updated existing issue for ${scraper} #${existingIssue.number}`);
                
              } else {
                const issueTitle = `[SCRAPER] Falha no Scraper - ${portalName}`;
                const issueBody = `## 🚨 Health Check Failed - ${portalName}

            **Portal**: ${portalName}  
            **Data/Hora**: ${currentDate}  
            **Tipo**: Falha na importação de spider/play

            ## 📋 Problema Detectado

            O monitor automático de scrapers detectou falhas no scraper do **${portalName}**. O scraper não pode ser importado corretamente, indicando possíveis problemas de:

            - [ ] **Sintaxe**: Erro de sintaxe no código Python
            - [ ] **Imports**: Dependências faltando ou imports incorretos  
            - [ ] **Estrutura**: Problemas na estrutura de classes do spider/play
            - [ ] **Configuração**: Parâmetros de configuração incorretos

            ${logSection}

            ## 🔧 Arquivos Relacionados

            - \`spiders/${scraper}.py\`
            - \`plays/${scraper}.py\`

            ## 🛠️ Como Investigar

            1. **Teste local**:
               \`\`\`bash
               python -c "from spiders.${scraper} import *"
               python -c "from plays.${scraper} import *"
               \`\`\`

            2. **Execute o scraper**:
               \`\`\`bash
               make crawl_${scraper}
               make scrape_${scraper}
               \`\`\`

            3. **Verifique os logs** para mensagens de erro específicas

            ## 📚 Recursos Úteis

            - [Tutorial de Spiders e Plays](https://github.com/aosfatos/check-up/blob/main/TUTORIAL_SPIDERS_PLAYS.md)
            - [Template de Adaptação](https://github.com/aosfatos/check-up/blob/main/.github/ISSUE_TEMPLATE/adaptar-scraper-existente.md)

            ---

            *Esta issue foi criada automaticamente pelo monitor de scrapers. Quando o scraper for corrigido, esta issue será fechada automaticamente no próximo health check.*`;

                const newIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: issueBody,
                  labels: ['scraper', 'portal', 'bug', 'automated', 'high-priority']
                });
                
                console.log(`Created new scraper failure issue for ${scraper} #${newIssue.data.number}`);
              }
            }

      - name: Close Resolved Scraper Issues
        uses: actions/github-script@v7
        with:
          script: |
            const failedScrapers = '${{ steps.scraper-test.outputs.FAILED_SCRAPERS }}';
            const failedList = failedScrapers ? failedScrapers.split(',').filter(s => s.trim()) : [];

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'scraper,automated,bug',
              state: 'open'
            });

            const scraperIssues = openIssues.data.filter(issue => 
              issue.body.includes('Health Check Failed')
            );

            for (const issue of scraperIssues) {
              const titleMatch = issue.title.match(/\[SCRAPER\] Falha no Scraper - (.+)/);
              if (!titleMatch) continue;
              
              const scraperName = titleMatch[1].toLowerCase();
              const isStillFailing = failedList.some(failed => 
                scraperName.includes(failed) || failed.includes(scraperName)
              );
              
              if (!isStillFailing) {
                const currentDate = new Date().toLocaleString('pt-BR', {
                  timeZone: 'America/Sao_Paulo',
                  year: 'numeric',
                  month: '2-digit',
                  day: '2-digit',
                  hour: '2-digit',
                  minute: '2-digit'
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## ✅ Scraper Recuperado

            **Data/Hora**: ${currentDate}  
            **Status**: Health check passou com sucesso

            O scraper está funcionando normalmente novamente! Esta issue está sendo fechada automaticamente.

            ---

            *Fechamento automático pelo monitor de scrapers.*`
                });
                
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                
                console.log(`Closed resolved scraper issue #${issue.number}`);
              }
            }